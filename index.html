<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXA</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;
    background:#f5f6f8;
    color:#17181c;
    height:100vh;
    overflow:hidden;
}

button,
input,
textarea{
    font:inherit;
}

button{
    border:0;
    cursor:pointer;
}

#app{
    display:flex;
    width:100%;
    height:100vh;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
    width:260px;
    height:100%;
    background:#ffffff;
    border-right:1px solid #e6e7eb;
    display:flex;
    flex-direction:column;
    padding:18px;
    flex-shrink:0;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
    padding:4px 4px 22px;
}

.logo{
    width:42px;
    height:42px;
    border-radius:13px;
    background:#17181c;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    font-weight:700;
    font-size:18px;
    letter-spacing:-1px;
}

.brand-name{
    font-size:20px;
    font-weight:700;
    letter-spacing:.5px;
}

.brand-sub{
    color:#8a8d95;
    font-size:11px;
    margin-top:2px;
}

.new-chat{
    width:100%;
    height:44px;
    border-radius:12px;
    background:#17181c;
    color:#fff;
    font-weight:600;
    margin-bottom:18px;
}

.new-chat:hover{
    background:#2b2d33;
}

.menu{
    display:flex;
    flex-direction:column;
    gap:5px;
}

.menu-item{
    height:44px;
    border-radius:10px;
    background:transparent;
    text-align:left;
    padding:0 13px;
    color:#555861;
    font-size:14px;
}

.menu-item:hover{
    background:#f1f2f4;
}

.menu-item.active{
    background:#eceef1;
    color:#17181c;
    font-weight:600;
}

.sidebar-bottom{
    margin-top:auto;
}

.memory-count{
    padding:15px;
    border:1px solid #e7e8eb;
    border-radius:12px;
    background:#fafafa;
}

.memory-count-label{
    color:#8a8d95;
    font-size:11px;
    margin-bottom:5px;
}

.memory-count-number{
    font-size:22px;
    font-weight:700;
}

/* =========================
   MAIN
========================= */

.main{
    flex:1;
    min-width:0;
    height:100%;
    display:flex;
    flex-direction:column;
}

.topbar{
    height:64px;
    border-bottom:1px solid #e6e7eb;
    background:rgba(255,255,255,.9);
    display:flex;
    align-items:center;
    padding:0 28px;
    flex-shrink:0;
}

.topbar-title{
    font-size:15px;
    font-weight:650;
}

.topbar-status{
    margin-left:auto;
    display:flex;
    align-items:center;
    gap:7px;
    color:#858891;
    font-size:12px;
}

.status-dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:#52a36a;
}

/* =========================
   CHAT
========================= */

.chat-page{
    flex:1;
    min-height:0;
    display:flex;
    flex-direction:column;
}

.messages{
    flex:1;
    overflow-y:auto;
    padding:34px 24px 20px;
}

.messages-inner{
    width:min(850px,100%);
    margin:0 auto;
}

.welcome{
    text-align:center;
    padding:90px 20px 40px;
}

.welcome-logo{
    width:66px;
    height:66px;
    border-radius:20px;
    margin:0 auto 18px;
    background:#17181c;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:26px;
    font-weight:700;
}

.welcome h1{
    font-size:28px;
    margin-bottom:9px;
}

.welcome p{
    color:#858891;
    font-size:14px;
    line-height:1.8;
}

.message{
    display:flex;
    margin-bottom:23px;
    gap:12px;
}

.message.user{
    justify-content:flex-end;
}

.avatar{
    width:34px;
    height:34px;
    border-radius:10px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
    font-weight:700;
}

.message.ai .avatar{
    background:#17181c;
    color:white;
}

.message.user .avatar{
    background:#e5e7eb;
    color:#33363d;
    order:2;
}

.bubble{
    max-width:min(680px,78%);
    padding:12px 15px;
    border-radius:14px;
    font-size:14px;
    line-height:1.75;
    white-space:pre-wrap;
    word-break:break-word;
}

.message.ai .bubble{
    background:#fff;
    border:1px solid #e7e8eb;
    border-top-left-radius:5px;
}

.message.user .bubble{
    background:#17181c;
    color:white;
    border-top-right-radius:5px;
}

/* =========================
   INPUT
========================= */

.input-area{
    padding:14px 24px 20px;
    background:linear-gradient(
        to bottom,
        rgba(245,246,248,0),
        #f5f6f8 20%
    );
}

.input-wrap{
    width:min(850px,100%);
    margin:0 auto;
    background:white;
    border:1px solid #dedfe3;
    border-radius:16px;
    display:flex;
    align-items:flex-end;
    padding:9px;
    box-shadow:0 5px 20px rgba(0,0,0,.035);
}

#messageInput{
    flex:1;
    border:0;
    outline:0;
    resize:none;
    min-height:42px;
    max-height:150px;
    padding:10px 12px;
    background:transparent;
    font-size:14px;
    line-height:1.6;
}

.send-button{
    width:42px;
    height:42px;
    border-radius:12px;
    background:#17181c;
    color:white;
    font-size:17px;
    flex-shrink:0;
}

.send-button:hover{
    background:#303239;
}

.input-note{
    width:min(850px,100%);
    margin:7px auto 0;
    text-align:center;
    color:#999ba2;
    font-size:10px;
}

/* =========================
   PAGES
========================= */

.page{
    display:none;
    flex:1;
    overflow-y:auto;
    padding:35px;
}

.page.active{
    display:block;
}

.page-inner{
    width:min(950px,100%);
    margin:0 auto;
}

.page-header{
    margin-bottom:25px;
}

.page-header h1{
    font-size:25px;
    margin-bottom:7px;
}

.page-header p{
    color:#858891;
    font-size:13px;
}

.memory-toolbar{
    display:flex;
    gap:10px;
    margin-bottom:20px;
}

.search-box{
    flex:1;
    height:43px;
    border:1px solid #dedfe3;
    border-radius:11px;
    padding:0 13px;
    outline:none;
    background:white;
}

.add-memory-button{
    height:43px;
    padding:0 17px;
    border-radius:11px;
    background:#17181c;
    color:white;
}

.memory-list{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.memory-card{
    background:white;
    border:1px solid #e5e6e9;
    border-radius:13px;
    padding:15px;
}

.memory-card-top{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:7px;
}

.memory-category{
    font-size:10px;
    padding:4px 7px;
    border-radius:6px;
    background:#f0f1f3;
    color:#666970;
}

.memory-date{
    font-size:10px;
    color:#a0a2a8;
}

.memory-content{
    font-size:14px;
    line-height:1.65;
}

.memory-source{
    margin-top:8px;
    color:#999ba2;
    font-size:11px;
}

.memory-delete{
    float:right;
    color:#a1a3a9;
    background:transparent;
    font-size:13px;
}

.empty{
    text-align:center;
    padding:70px 20px;
    color:#999ba2;
    font-size:13px;
}

/* =========================
   SETTINGS
========================= */

.setting-card{
    background:white;
    border:1px solid #e5e6e9;
    border-radius:14px;
    margin-bottom:12px;
    overflow:hidden;
}

.setting-row{
    min-height:60px;
    padding:14px 17px;
    display:flex;
    align-items:center;
    border-bottom:1px solid #eeeeef;
}

.setting-row:last-child{
    border-bottom:0;
}

.setting-title{
    font-size:14px;
    font-weight:600;
}

.setting-description{
    margin-top:3px;
    color:#90929a;
    font-size:11px;
}

.setting-action{
    margin-left:auto;
    padding:8px 12px;
    border-radius:8px;
    background:#f0f1f3;
    font-size:12px;
}

.setting-action.danger{
    color:#b53d3d;
}

/* =========================
   MODAL
========================= */

.modal-bg{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.32);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:20;
    padding:20px;
}

.modal-bg.show{
    display:flex;
}

.modal{
    width:min(500px,100%);
    background:white;
    border-radius:17px;
    padding:22px;
    box-shadow:0 20px 60px rgba(0,0,0,.18);
}

.modal h2{
    font-size:19px;
    margin-bottom:18px;
}

.modal textarea{
    width:100%;
    min-height:130px;
    resize:vertical;
    border:1px solid #dddfe3;
    border-radius:10px;
    padding:11px;
    outline:none;
}

.modal-buttons{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    margin-top:14px;
}

.cancel{
    background:#f0f1f3;
    padding:9px 14px;
    border-radius:9px;
}

.save{
    background:#17181c;
    color:white;
    padding:9px 14px;
    border-radius:9px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:720px){

    .sidebar{
        width:70px;
        padding:10px;
    }

    .brand-name,
    .brand-sub,
    .new-chat,
    .menu-text,
    .memory-count{
        display:none;
    }

    .brand{
        justify-content:center;
        padding-bottom:18px;
    }

    .menu-item{
        text-align:center;
        padding:0;
        font-size:0;
    }

    .menu-item::before{
        font-size:16px;
    }

    .menu-item:nth-child(1)::before{content:"C";}
    .menu-item:nth-child(2)::before{content:"M";}
    .menu-item:nth-child(3)::before{content:"＋";}
    .menu-item:nth-child(4)::before{content:"S";}

    .topbar{
        padding:0 16px;
    }

    .messages{
        padding-left:13px;
        padding-right:13px;
    }

    .input-area{
        padding-left:12px;
        padding-right:12px;
    }

    .page{
        padding:24px 15px;
    }
}
</style>
</head>

<body>

<div id="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="brand">
            <div class="logo">N</div>
            <div>
                <div class="brand-name">NEXA</div>
                <div class="brand-sub">Memory AI</div>
            </div>
        </div>

        <button class="new-chat" onclick="newChat()">
            ＋ 新しい会話
        </button>

        <nav class="menu">

            <button class="menu-item active" data-page="chat">
                <span class="menu-text">チャット</span>
            </button>

            <button class="menu-item" data-page="memory">
                <span class="menu-text">記憶</span>
            </button>

            <button class="menu-item" onclick="openMemoryModal()">
                <span class="menu-text">記憶を追加</span>
            </button>

            <button class="menu-item" data-page="settings">
                <span class="menu-text">設定</span>
            </button>

        </nav>

        <div class="sidebar-bottom">
            <div class="memory-count">
                <div class="memory-count-label">NEXAの記憶</div>
                <div class="memory-count-number" id="memoryCount">0</div>
            </div>
        </div>

    </aside>


    <!-- MAIN -->
    <main class="main">

        <header class="topbar">
            <div class="topbar-title" id="topbarTitle">
                チャット
            </div>

            <div class="topbar-status">
                <span class="status-dot"></span>
                ローカルモード
            </div>
        </header>


        <!-- CHAT PAGE -->
        <section class="chat-page" id="chatPage">

            <div class="messages" id="messages">

                <div class="messages-inner" id="messagesInner">

                    <div class="welcome" id="welcome">

                        <div class="welcome-logo">N</div>

                        <h1>NEXA</h1>

                        <p>
                            君が教えてくれたことを覚えていくAI。<br>
                            外部APIを使わず、このブラウザの中で動作します。
                        </p>

                    </div>

                </div>

            </div>


            <div class="input-area">

                <div class="input-wrap">

                    <textarea
                        id="messageInput"
                        placeholder="NEXAに話しかける..."
                        rows="1"
                    ></textarea>

                    <button class="send-button" onclick="sendMessage()">
                        ↑
                    </button>

                </div>

                <div class="input-note">
                    NEXAは君が教えた情報をこのブラウザに保存します。
                </div>

            </div>

        </section>


        <!-- MEMORY PAGE -->
        <section class="page" id="memoryPage">

            <div class="page-inner">

                <div class="page-header">
                    <h1>記憶</h1>
                    <p>NEXAが覚えている情報を確認できます。</p>
                </div>

                <div class="memory-toolbar">

                    <input
                        class="search-box"
                        id="memorySearch"
                        placeholder="記憶を検索..."
                        oninput="renderMemories()"
                    >

                    <button
                        class="add-memory-button"
                        onclick="openMemoryModal()"
                    >
                        ＋ 追加
                    </button>

                </div>

                <div class="memory-list" id="memoryList"></div>

            </div>

        </section>


        <!-- SETTINGS -->
        <section class="page" id="settingsPage">

            <div class="page-inner">

                <div class="page-header">
                    <h1>設定</h1>
                    <p>NEXAのデータと動作を管理します。</p>
                </div>

                <div class="setting-card">

                    <div class="setting-row">

                        <div>
                            <div class="setting-title">
                                ローカル記憶
                            </div>

                            <div class="setting-description">
                                ブラウザのlocalStorageに保存します。
                            </div>
                        </div>

                        <button
                            class="setting-action"
                            onclick="exportMemory()"
                        >
                            書き出す
                        </button>

                    </div>


                    <div class="setting-row">

                        <div>
                            <div class="setting-title">
                                記憶を読み込む
                            </div>

                            <div class="setting-description">
                                保存したNEXAの記憶を読み込みます。
                            </div>
                        </div>

                        <button
                            class="setting-action"
                            onclick="document.getElementById('importFile').click()"
                        >
                            読み込む
                        </button>

                        <input
                            type="file"
                            id="importFile"
                            accept=".json"
                            hidden
                            onchange="importMemory(event)"
                        >

                    </div>


                    <div class="setting-row">

                        <div>
                            <div class="setting-title">
                                すべての記憶を削除
                            </div>

                            <div class="setting-description">
                                NEXAが覚えた情報をすべて削除します。
                            </div>
                        </div>

                        <button
                            class="setting-action danger"
                            onclick="clearMemories()"
                        >
                            削除
                        </button>

                    </div>

                </div>

            </div>

        </section>

    </main>

</div>


<!-- MEMORY MODAL -->

<div class="modal-bg" id="memoryModal">

    <div class="modal">

        <h2>NEXAに記憶させる</h2>

        <textarea
            id="memoryInput"
            placeholder="例：俺は小説を書くのが好き。"
        ></textarea>

        <div class="modal-buttons">

            <button class="cancel" onclick="closeMemoryModal()">
                キャンセル
            </button>

            <button class="save" onclick="saveManualMemory()">
                記憶する
            </button>

        </div>

    </div>

</div>


<script>

/* =========================================================
   NEXA CORE
========================================================= */

const STORAGE_MEMORY = "nexa_memories_v1";
const STORAGE_CHAT = "nexa_chat_v1";

let memories = loadMemories();
let chatHistory = loadChat();


/* =========================================================
   INITIALIZE
========================================================= */

document.addEventListener("DOMContentLoaded", () => {

    updateMemoryCount();
    renderMemories();
    restoreChat();

    const input = document.getElementById("messageInput");

    input.addEventListener("keydown", (event) => {

        if(event.key === "Enter" && !event.shiftKey){

            event.preventDefault();
            sendMessage();

        }

    });

    input.addEventListener("input", () => {

        input.style.height = "auto";
        input.style.height =
            Math.min(input.scrollHeight,150) + "px";

    });

    document.querySelectorAll(".menu-item[data-page]")
        .forEach(button => {

            button.addEventListener("click", () => {

                switchPage(button.dataset.page);

            });

        });

});


/* =========================================================
   STORAGE
========================================================= */

function loadMemories(){

    try{

        const data =
            localStorage.getItem(STORAGE_MEMORY);

        return data ? JSON.parse(data) : [];

    }catch(error){

        return [];

    }

}


function saveMemories(){

    localStorage.setItem(
        STORAGE_MEMORY,
        JSON.stringify(memories)
    );

    updateMemoryCount();

}


function loadChat(){

    try{

        const data =
            localStorage.getItem(STORAGE_CHAT);

        return data ? JSON.parse(data) : [];

    }catch(error){

        return [];

    }

}


function saveChat(){

    localStorage.setItem(
        STORAGE_CHAT,
        JSON.stringify(chatHistory)
    );

}


/* =========================================================
   CHAT
========================================================= */

function sendMessage(){

    const input =
        document.getElementById("messageInput");

    const text =
        input.value.trim();

    if(!text) return;

    input.value = "";
    input.style.height = "auto";

    hideWelcome();

    addMessage("user",text);

    chatHistory.push({
        role:"user",
        content:text,
        time:Date.now()
    });

    saveChat();

    /*
       まず入力文から記憶候補を探す。
    */

    const learned =
        extractMemories(text);

    learned.forEach(memory => {

        addOrUpdateMemory(memory);

    });

    /*
       会話エンジン
    */

    setTimeout(() => {

        const response =
            generateResponse(text);

        addMessage("ai",response);

        chatHistory.push({
            role:"ai",
            content:response,
            time:Date.now()
        });

        saveChat();

    },180);

}


function addMessage(role,text){

    const container =
        document.getElementById("messagesInner");

    const message =
        document.createElement("div");

    message.className =
        "message " + role;

    const avatar =
        document.createElement("div");

    avatar.className = "avatar";

    avatar.textContent =
        role === "ai" ? "N" : "君";

    const bubble =
        document.createElement("div");

    bubble.className = "bubble";
    bubble.textContent = text;

    message.appendChild(avatar);
    message.appendChild(bubble);

    container.appendChild(message);

    scrollMessages();

}


function hideWelcome(){

    const welcome =
        document.getElementById("welcome");

    if(welcome){

        welcome.remove();

    }

}


function scrollMessages(){

    const messages =
        document.getElementById("messages");

    messages.scrollTop =
        messages.scrollHeight;

}


/* =========================================================
   MEMORY EXTRACTION
========================================================= */

function extractMemories(text){

    const results = [];

    /*
       決まった一文だけではなく、
       複数の言い回しから候補を探す。
    */

    const patterns = [

        {
            regex:/(?:俺|僕|私は|わたしは|自分は)[、 ]*(.+?)(?:が好き|が大好き|好きなんだ|好きだよ|好きです)[。！!]?$/i,
            category:"好み",
            key:"好き"
        },

        {
            regex:/(?:俺|僕|私は|わたしは)[、 ]*(.+?)(?:って呼んで|と呼んで|と呼んでほしい|と呼んでくれ)[。！!]?$/i,
            category:"呼び方",
            key:"呼び名"
        },

        {
            regex:/(?:俺|僕|私は|わたしは)[、 ]*(.+?)(?:なんだ|なんだよ|です|だよ)[。！!]?$/i,
            category:"プロフィール",
            key:"自己情報"
        },

        {
            regex:/(.+?)(?:は|って|というのは)[、 ]*(.+?)(?:だよ|です|なんだ|なんです)[。！!]?$/i,
            category:"知識",
            key:"情報"
        },

        {
            regex:/(.+?)(?:を覚えて|覚えといて|覚えておいて|記憶して|記憶しといて)[。！!]?$/i,
            category:"ユーザー指定",
            key:"明示記憶"
        },

        {
            regex:/(.+?)(?:を忘れて|忘れておいて|忘れてくれ)[。！!]?$/i,
            category:"削除",
            key:"忘却"
        }

    ];

    for(const pattern of patterns){

        const match =
            text.match(pattern.regex);

        if(!match) continue;

        let value =
            match[1].trim();

        if(!value) continue;

        /*
           「覚えて」系
        */

        if(pattern.key === "忘却"){

            removeMemoriesByText(value);

            continue;

        }

        results.push({

            category:pattern.category,
            key:pattern.key,
            value:value,
            source:text,
            createdAt:Date.now()

        });

    }

    /*
       名前系の追加認識
    */

    const namePatterns = [

        /(?:俺|僕|私は|わたしは)[、 ]*(?:名前は|名は)[、 ]*(.+?)(?:だ|です|だよ|だよね)[。！!]?$/,

        /(?:俺|僕|私は|わたしは)[、 ]*(.+?)(?:って名前|という名前)[。！!]?$/,

        /(?:俺|僕)[は、 ]*(.+?)(?:って呼ばれてる|と呼ばれてる)[。！!]?$/

    ];

    for(const pattern of namePatterns){

        const match =
            text.match(pattern);

        if(match){

            results.push({

                category:"プロフィール",
                key:"名前",
                value:match[1].trim(),
                source:text,
                createdAt:Date.now()

            });

        }

    }

    return results;

}


/* =========================================================
   MEMORY UPDATE
========================================================= */

function addOrUpdateMemory(memory){

    if(!memory.value) return;

    /*
       似た記憶を探す。
    */

    const normalized =
        normalize(memory.value);

    const existingIndex =
        memories.findIndex(item => {

            return (
                item.category === memory.category &&
                item.key === memory.key &&
                normalize(item.value) === normalized
            );

        });

    if(existingIndex !== -1){

        memories[existingIndex] = {
            ...memories[existingIndex],
            source:memory.source,
            updatedAt:Date.now()
        };

    }else{

        memories.unshift({

            id:
                Date.now().toString(36) +
                Math.random().toString(36).slice(2),

            category:memory.category,
            key:memory.key,
            value:memory.value,
            source:memory.source,
            createdAt:memory.createdAt || Date.now(),
            updatedAt:Date.now()

        });

    }

    saveMemories();
    renderMemories();

}


function normalize(text){

    return text
        .toLowerCase()
        .replace(/[。、！？!?「」『』（）()]/g,"")
        .replace(/\s+/g,"")
        .trim();

}


/* =========================================================
   MEMORY SEARCH
========================================================= */

function searchMemories(query){

    if(!query){

        return memories.slice();

    }

    const words =
        tokenize(query);

    return memories
        .map(memory => {

            let score = 0;

            const target =
                normalize(
                    memory.category +
                    " " +
                    memory.key +
                    " " +
                    memory.value +
                    " " +
                    memory.source
                );

            words.forEach(word => {

                if(target.includes(normalize(word))){

                    score += 10;

                }

            });

            /*
               最近の記憶を少し優先
            */

            const age =
                Date.now() - memory.updatedAt;

            if(age < 86400000){

                score += 2;

            }

            return {
                memory,
                score
            };

        })
        .filter(item => item.score > 0)
        .sort((a,b) => b.score - a.score)
        .map(item => item.memory);

}


function tokenize(text){

    return text
        .split(
            /[\s、。！？!?「」『』はがをにのへとでやもからまでっていう]/g
        )
        .filter(word => word.length > 0);

}


/* =========================================================
   RESPONSE ENGINE
========================================================= */

function generateResponse(text){

    const normalized =
        normalize(text);

    /*
       挨拶
    */

    if(
        /^(こんにちは|こんばんは|おはよう|やあ|やっほー|おーい)/.test(normalized)
    ){

        return choose([
            "こんにちは。今日は何を話そうか？",
            "やあ。何か教えてくれる？",
            "こんにちは。ちゃんとここにいるよ。"
        ]);

    }


    /*
       名前質問
    */

    if(
        /(?:俺|僕|私)の名前|俺って誰|僕って誰/.test(normalized)
    ){

        const found =
            memories.filter(
                m => m.key === "名前"
            );

        if(found.length){

            return "君の名前は「" +
                found[0].value +
                "」って覚えてるよ。";

        }

        return "まだ名前は教えてもらってないよ。";

    }


    /*
       記憶を全部聞く
    */

    if(
        /何を覚えて|何覚えて|覚えてること|記憶してること|記憶は何/.test(normalized)
    ){

        if(memories.length === 0){

            return "まだ何も覚えていないよ。何か教えてくれる？";

        }

        const important =
            memories.slice(0,8);

        let response =
            "今覚えていることをいくつか挙げるね。\n\n";

        important.forEach(memory => {

            response +=
                "・" +
                memory.value +
                "\n";

        });

        if(memories.length > 8){

            response +=
                "\n他にも " +
                (memories.length - 8) +
                " 件覚えているよ。";

        }

        return response;

    }


    /*
       好きなもの
    */

    if(
        /何が好き|好きなもの|好きなの/.test(normalized)
    ){

        const found =
            memories.filter(
                m => m.category === "好み"
            );

        if(found.length){

            return "君について覚えている好きなものは、\n\n" +
                found
                    .slice(0,10)
                    .map(m => "・" + m.value)
                    .join("\n");

        }

    }


    /*
       入力に関係する記憶
    */

    const relevant =
        searchMemories(text);

    if(relevant.length){

        const top =
            relevant.slice(0,5);

        /*
           「覚えていること」を自然に返す。
        */

        if(
            /知ってる|覚えて|について|どう思う|何/.test(normalized)
        ){

            let response =
                "君が前に教えてくれたことだと、\n";

            top.forEach(memory => {

                response +=
                    "・" +
                    memory.value +
                    "\n";

            });

            return response.trim();

        }

        /*
           会話の継続
        */

        return choose([

            "そうなんだ。前に教えてくれた「" +
            top[0].value +
            "」とも関係ありそうだね。",

            "なるほど。前に聞いた話も合わせると、少し見えてきたよ。",

            "覚えてるよ。その話、前に教えてくれたこととつながってるね。"

        ]);

    }


    /*
       記憶された情報がない場合
    */

    if(
        /教えて|覚えて|記憶/.test(normalized)
    ){

        return "わかった。君が教えてくれたこととして扱うよ。";

    }


    /*
       感情・雑談
    */

    if(
        /疲れた|しんどい|眠い|疲れる/.test(normalized)
    ){

        return choose([

            "お疲れ。今日は大変だったみたいだね。",

            "そっか。少し休んでもいいと思うよ。",

            "疲れてるんだね。無理しすぎないで。"

        ]);

    }


    if(
        /嬉しい|うれしい|楽しい|最高/.test(normalized)
    ){

        return choose([

            "それはよかった。何があったの？",

            "いいね。そういう話、もっと聞きたい。",

            "楽しそうだね。"

        ]);

    }


    /*
       一般的な会話
       ※外部知識は使用しない
    */

    return choose([

        "なるほど。もう少し聞かせて。",

        "そうなんだ。それについてもう少し教えてほしい。",

        "うん。ちゃんと聞いてるよ。",

        "なるほどね。",

        "そういうことか。",

        "それは覚えておいたほうがよさそうだね。"

    ]);

}


/* =========================================================
   RANDOM RESPONSE
========================================================= */

function choose(array){

    return array[
        Math.floor(
            Math.random() * array.length
        )
    ];

}


/* =========================================================
   MANUAL MEMORY
========================================================= */

function openMemoryModal(){

    document
        .getElementById("memoryModal")
        .classList.add("show");

    document
        .getElementById("memoryInput")
        .focus();

}


function closeMemoryModal(){

    document
        .getElementById("memoryModal")
        .classList.remove("show");

}


function saveManualMemory(){

    const input =
        document.getElementById("memoryInput");

    const text =
        input.value.trim();

    if(!text) return;

    const memory = {

        category:"手動登録",
        key:"情報",
        value:text,
        source:"手動登録",
        createdAt:Date.now()

    };

    addOrUpdateMemory(memory);

    input.value = "";

    closeMemoryModal();

}


/* =========================================================
   MEMORY UI
========================================================= */

function renderMemories(){

    const list =
        document.getElementById("memoryList");

    if(!list) return;

    const query =
        document
            .getElementById("memorySearch")
            ?.value
            .trim() || "";

    const result =
        searchMemories(query);

    list.innerHTML = "";

    if(result.length === 0){

        const empty =
            document.createElement("div");

        empty.className = "empty";

        empty.textContent =
            memories.length === 0
                ? "まだ記憶がありません。"
                : "該当する記憶がありません。";

        list.appendChild(empty);

        return;

    }

    result.forEach(memory => {

        const card =
            document.createElement("div");

        card.className = "memory-card";

        const top =
            document.createElement("div");

        top.className = "memory-card-top";

        const category =
            document.createElement("span");

        category.className =
            "memory-category";

        category.textContent =
            memory.category;

        const date =
            document.createElement("span");

        date.className =
            "memory-date";

        date.textContent =
            formatDate(memory.updatedAt);

        const deleteButton =
            document.createElement("button");

        deleteButton.className =
            "memory-delete";

        deleteButton.textContent = "削除";

        deleteButton.onclick = () => {

            deleteMemory(memory.id);

        };

        top.appendChild(category);
        top.appendChild(date);
        top.appendChild(deleteButton);

        const content =
            document.createElement("div");

        content.className =
            "memory-content";

        content.textContent =
            memory.value;

        const source =
            document.createElement("div");

        source.className =
            "memory-source";

        source.textContent =
            "登録元：" +
            memory.source;

        card.appendChild(top);
        card.appendChild(content);
        card.appendChild(source);

        list.appendChild(card);

    });

}


function formatDate(timestamp){

    const date =
        new Date(timestamp);

    return date.toLocaleString(
        "ja-JP",
        {
            year:"numeric",
            month:"numeric",
            day:"numeric",
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}


function deleteMemory(id){

    memories =
        memories.filter(
            memory => memory.id !== id
        );

    saveMemories();
    renderMemories();

}


function removeMemoriesByText(text){

    const target =
        normalize(text);

    memories =
        memories.filter(memory => {

            const value =
                normalize(memory.value);

            return !(
                value.includes(target) ||
                target.includes(value)
            );

        });

    saveMemories();
    renderMemories();

}


/* =========================================================
   COUNT
========================================================= */

function updateMemoryCount(){

    const count =
        document.getElementById("memoryCount");

    if(count){

        count.textContent =
            memories.length.toLocaleString();

    }

}


/* =========================================================
   PAGE SWITCH
========================================================= */

function switchPage(page){

    const chat =
        document.getElementById("chatPage");

    const memory =
        document.getElementById("memoryPage");

    const settings =
        document.getElementById("settingsPage");

    chat.style.display =
        page === "chat"
            ? "flex"
            : "none";

    memory.classList.toggle(
        "active",
        page === "memory"
    );

    settings.classList.toggle(
        "active",
        page === "settings"
    );

    document
        .querySelectorAll(".menu-item[data-page]")
        .forEach(button => {

            button.classList.toggle(
                "active",
                button.dataset.page === page
            );

        });

    const titles = {

        chat:"チャット",
        memory:"記憶",
        settings:"設定"

    };

    document.getElementById(
        "topbarTitle"
    ).textContent = titles[page];

}


/* =========================================================
   NEW CHAT
========================================================= */

function newChat(){

    chatHistory = [];

    saveChat();

    const container =
        document.getElementById("messagesInner");

    container.innerHTML = "";

    const welcome =
        document.createElement("div");

    welcome.className = "welcome";
    welcome.id = "welcome";

    welcome.innerHTML = `
        <div class="welcome-logo">N</div>
        <h1>NEXA</h1>
        <p>
            新しい会話を開始しました。<br>
            記憶はそのまま残っています。
        </p>
    `;

    container.appendChild(welcome);

    switchPage("chat");

}


/* =========================================================
   RESTORE CHAT
========================================================= */

function restoreChat(){

    if(chatHistory.length === 0){

        return;

    }

    hideWelcome();

    chatHistory.forEach(message => {

        addMessage(
            message.role,
            message.content
        );

    });

}


/* =========================================================
   EXPORT
========================================================= */

function exportMemory(){

    const data = {

        version:1,
        exportedAt:new Date().toISOString(),
        memories:memories

    };

    const blob =
        new Blob(
            [JSON.stringify(data,null,2)],
            {
                type:"application/json"
            }
        );

    const url =
        URL.createObjectURL(blob);

    const link =
        document.createElement("a");

    link.href = url;
    link.download = "nexa-memory.json";

    link.click();

    URL.revokeObjectURL(url);

}


/* =========================================================
   IMPORT
========================================================= */

function importMemory(event){

    const file =
        event.target.files[0];

    if(!file) return;

    const reader =
        new FileReader();

    reader.onload = () => {

        try{

            const data =
                JSON.parse(reader.result);

            if(
                !data ||
                !Array.isArray(data.memories)
            ){

                alert("NEXAの記憶ファイルではありません。");
                return;

            }

            memories = data.memories;

            saveMemories();
            renderMemories();

            alert(
                memories.length +
                "件の記憶を読み込みました。"
            );

        }catch(error){

            alert("ファイルを読み込めませんでした。");

        }

    };

    reader.readAsText(file);

}


/* =========================================================
   CLEAR
========================================================= */

function clearMemories(){

    if(
        !confirm(
            "NEXAが覚えている情報をすべて削除しますか？"
        )
    ){

        return;

    }

    memories = [];

    saveMemories();
    renderMemories();

}


/* =========================================================
   MODAL CLOSE
========================================================= */

document
    .getElementById("memoryModal")
    .addEventListener("click",event => {

        if(
            event.target.id === "memoryModal"
        ){

            closeMemoryModal();

        }

    });
